# Shared by every role. Role-specific settings live in application-<role>.yml.
spring:
  application:
    name: scan-queue
  main:
    web-application-type: none          # only the api profile runs a web server
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scanqueue}
    username: ${DB_USER:scanqueue}
    password: ${DB_PASSWORD:scanqueue}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
  flyway:
    enabled: true                         # Flyway takes a Postgres advisory lock, so concurrent starts are safe

scanqueue:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:scanqueue}
    secret-key: ${MINIO_SECRET_KEY:scanqueue-secret}
    bucket: ${MINIO_BUCKET:uploads}
  jobs:
    max-attempts: ${JOB_MAX_ATTEMPTS:5}
  worker:
    concurrency: ${WORKER_CONCURRENCY:2}
    lease-millis: ${WORKER_LEASE_MILLIS:10000}         # lease granted per claim / renewal (DB clock)
    heartbeat-millis: ${WORKER_HEARTBEAT_MILLIS:3000}  # renew every 3 s -> survives 2 missed beats
    poll-millis: ${WORKER_POLL_MILLIS:200}
    reaper-millis: ${WORKER_REAPER_MILLIS:1000}
    retry-backoff-millis: ${WORKER_RETRY_BACKOFF_MILLIS:2000}
  yara:
    binary: ${YARA_BINARY:yara}
    timeout-millis: ${YARA_TIMEOUT_MILLIS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health
