spring:
  application:
    name: mock-webhook
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webhook}
    username: ${DB_USER:scanqueue}
    password: ${DB_PASSWORD:scanqueue}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:6}
      schema: webhook                  # all tables live in the webhook schema
  flyway:
    schemas: webhook                   # created by Flyway if missing
    default-schema: webhook

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 32

webhook:
  response-delay-millis: ${WEBHOOK_RESPONSE_DELAY_MILLIS:0}
  fail-after-commit-rate: ${WEBHOOK_FAIL_AFTER_COMMIT_RATE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
